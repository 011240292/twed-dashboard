<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeaponGuard Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow-x: hidden;
            background: #111827;
        }
        .camera-box {
            transition: all 0.3s ease;
        }
        .camera-box:hover {
            transform: scale(1.02);
        }
        .alert-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 bg-gray-800 p-4 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-bold">WeaponGuard Pro</h1>
                <span class="text-green-400 text-sm bg-green-900 px-3 py-1 rounded-full font-semibold">SYSTEM ARMED</span>
            </div>
        </div>
        <div class="flex items-center gap-8 text-base">
            <div>
                <span class="text-gray-400">Alerts: </span>
                <span class="text-red-400 font-bold text-xl" id="alertCount">3 Active</span>
            </div>
            <div>
                <span class="text-gray-400">Cameras: </span>
                <span class="text-green-400 font-bold text-xl">24/24</span>
            </div>
            <div class="text-gray-300 font-mono text-lg" id="currentTime"></div>
        </div>
    </div>

    <div class="px-4 grid grid-cols-3 gap-6">
        
        <!-- Camera Grid -->
        <div class="col-span-2">
            <div class="grid grid-cols-4 gap-4" id="cameraGrid"></div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-2 gap-4 mt-6">
                <div class="bg-gray-800 p-8 rounded-xl text-center shadow-lg">
                    <div class="text-6xl font-bold text-red-400 mb-2">27</div>
                    <div class="text-gray-400 text-lg">Detections Today</div>
                </div>
                <div class="bg-gray-800 p-8 rounded-xl text-center shadow-lg">
                    <div class="text-6xl font-bold text-green-400 mb-2">98.2%</div>
                    <div class="text-gray-400 text-lg">System Uptime</div>
                </div>
            </div>
        </div>

        <!-- Active Alerts Panel -->
        <div class="bg-gray-800 rounded-xl p-5 shadow-lg">
            <div class="flex items-center gap-3 mb-5 border-b border-gray-700 pb-3">
                <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <h2 class="text-2xl font-bold">Active Alerts (<span id="alertCountSidebar">3</span>)</h2>
            </div>

            <div id="alertsContainer" class="space-y-4"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t-2 border-gray-700 p-4 flex justify-around shadow-lg">
        <button class="flex items-center gap-2 text-gray-300 hover:text-white transition">
            <div class="grid grid-cols-2 gap-1">
                <div class="w-2 h-2 bg-gray-400 rounded"></div>
                <div class="w-2 h-2 bg-gray-400 rounded"></div>
                <div class="w-2 h-2 bg-gray-400 rounded"></div>
                <div class="w-2 h-2 bg-gray-400 rounded"></div>
            </div>
            <span class="font-semibold">Dashboard</span>
        </button>
        <button class="flex items-center gap-2 text-gray-300 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span class="font-semibold">Analytics</span>
        </button>
        <button class="flex items-center gap-2 text-gray-300 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="font-semibold">Settings</span>
        </button>
    </div>

    <script>
        // Camera Data
        const cameras = [
            { id: 1, name: 'Cam 01', location: 'Main Entrance', alert: 'Knife', confidence: 92 },
            { id: 2, name: 'Cam 02', location: 'Lobby Area', alert: null, confidence: 0 },
            { id: 3, name: 'Cam 03', location: 'Gate A', alert: 'Handgun', confidence: 88 },
            { id: 4, name: 'Cam 04', location: 'Lobby Area', alert: null, confidence: 0 },
            { id: 5, name: 'Cam 05', location: 'Back Exit', alert: null, confidence: 0 },
            { id: 6, name: 'Cam 06', location: 'Parking Lot', alert: 'Rifle', confidence: 79 },
            { id: 7, name: 'Cam 07', location: 'Lobby Area', alert: null, confidence: 0 },
            { id: 8, name: 'Cam 08', location: 'Side Gate', alert: null, confidence: 0 }
        ];

        // Alert Data
        let alerts = [
            { id: 1, time: '14:22:51', weapon: 'Handgun', confidence: 88, camera: 'Camera 03', location: 'Gate A' },
            { id: 2, time: '14:22:12', weapon: 'Knife', confidence: 92, camera: 'Camera 01', location: 'Main Entrance' },
            { id: 3, time: '14:19:05', weapon: 'Rifle', confidence: 79, camera: 'Camera 06', location: 'Parking Lot' }
        ];

        // Update Time
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Render Cameras
        function renderCameras() {
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = cameras.map(cam => `
                <div class="camera-box bg-gray-800 rounded-lg p-4 border-2 ${cam.alert ? 'border-red-500 alert-pulse' : 'border-gray-700'}">
                    ${cam.alert ? `<div class="bg-red-600 text-white px-2 py-1 rounded text-xs font-bold mb-2">${cam.alert} ${cam.confidence}%</div>` : ''}
                    <div class="flex items-center justify-center h-32 bg-gray-700 rounded mb-3">
                        <svg class="w-16 h-16 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-lg">${cam.name}</span>
                        <span class="text-xs text-gray-400">${cam.location}</span>
                    </div>
                </div>
            `).join('');
        }

        // Render Alerts
        function renderAlerts() {
            const container = document.getElementById('alertsContainer');
            if (alerts.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">No active alerts</div>';
                document.getElementById('alertCount').textContent = '0 Active';
                document.getElementById('alertCountSidebar').textContent = '0';
                return;
            }

            container.innerHTML = alerts.map(alert => `
                <div class="bg-red-950 border border-red-600 rounded-lg p-4 alert-pulse">
                    <div class="text-xs text-gray-400 mb-1">${alert.time}</div>
                    <div class="text-lg font-bold mb-1">${alert.weapon} Detected (${alert.confidence}%)</div>
                    <div class="text-sm text-gray-300 mb-3">${alert.camera} → ${alert.location}</div>
                    <div class="flex gap-2">
                        <button onclick="acknowledgeAlert(${alert.id})" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 px-3 rounded text-sm font-semibold transition">
                            Acknowledge
                        </button>
                        <button onclick="falsePositive(${alert.id})" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 px-3 rounded text-sm font-semibold transition">
                            False
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('alertCount').textContent = `${alerts.length} Active`;
            document.getElementById('alertCountSidebar').textContent = alerts.length;
        }

        // Handle Alert Actions
        function acknowledgeAlert(id) {
            alerts = alerts.filter(alert => alert.id !== id);
            renderAlerts();
        }

        function falsePositive(id) {
            alerts = alerts.filter(alert => alert.id !== id);
            renderAlerts();
        }

        // Initialize
        renderCameras();
        renderAlerts();
    </script>

</body>
</html>
